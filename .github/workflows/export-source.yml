name: Export source

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Create source archive
        run: |
          zip -r knightbot-source.zip . \
            -x '.git/*' \
            -x 'knightbot-source.zip'
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: knightbot-source
          path: knightbot-source.zip
          if-no-files-found: error
          retention-days: 1

# Trigger export after the workflow exists on the base branch.
