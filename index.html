<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Knight Bot Pair Code</title>
  <style>
    :root { color-scheme: dark; }
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0f172a;color:#e2e8f0;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0;padding:16px}
    .card{width:100%;max-width:540px;background:#111827;border:1px solid #334155;border-radius:14px;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
    h1{margin:0 0 8px;font-size:1.5rem}
    p{color:#94a3b8;margin:0 0 16px}
    input,button{width:100%;padding:12px;border-radius:10px;border:1px solid #334155;font-size:1rem;box-sizing:border-box}
    input{background:#0b1220;color:#e2e8f0;margin-bottom:12px}
    button{background:#2563eb;color:#fff;border:none;font-weight:700;cursor:pointer}
    .result{margin-top:16px;padding:14px;border-radius:10px;background:#0b1220;border:1px solid #334155}
    .error{border-color:#ef4444;color:#fda4af}
    .code{font-size:1.4rem;letter-spacing:.1em;font-weight:700;color:#86efac;text-align:center;word-break:break-word}
    .steps{margin-top:12px;font-size:.95rem;color:#cbd5e1}
    .hint{margin-top:8px;font-size:.85rem;color:#94a3b8}
  </style>
</head>
<body>
  <main class="card">
    <h1>Connect Knight Bot</h1>
    <p>Enter your WhatsApp number (country code included, no + sign), then use the generated code in Linked Devices.</p>
    <form id="pair-form">
      <input id="number" name="number" required placeholder="e.g. 14155552671" pattern="[0-9]{6,20}" />
      <button type="submit">Generate Pair Code</button>
    </form>
    <div class="hint">Health: <code>/health</code> • API: <code>/api/pair-code?number=...</code></div>
    <div id="output"></div>
  </main>

  <script>
    const form = document.getElementById('pair-form');
    const output = document.getElementById('output');
    const numberInput = document.getElementById('number');

    const params = new URLSearchParams(window.location.search);
    if (params.get('number')) numberInput.value = params.get('number');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const number = String(numberInput.value || '').replace(/\D/g, '');
      history.replaceState(null, '', `/?number=${encodeURIComponent(number)}`);

      output.innerHTML = '<div class="result">Generating code...</div>';

      try {
        const res = await fetch(`/api/pair-code?number=${encodeURIComponent(number)}`, { cache: 'no-store' });
        const raw = await res.text();
        let data;

        try {
          data = JSON.parse(raw);
        } catch {
          throw new Error('Pair service is temporarily unavailable. Please try again in a moment.');
        }

        if (!res.ok || !data.ok) {
          throw new Error(data.error || 'Failed to generate code right now. Please try again.');
        }

        output.innerHTML = `
          <div class="result">
            <div class="code">${data.code}</div>
            <div class="steps">Open WhatsApp → Settings → Linked Devices → Link a Device → Link with phone number instead → Enter this code.</div>
          </div>
        `;
      } catch (error) {
        output.innerHTML = `<div class="result error">${error.message}</div>`;
      }
    });

    if (numberInput.value) form.requestSubmit();
  </script>
</body>
</html>
